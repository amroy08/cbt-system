<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin First-Run Setup - CBT System</title>
  <link rel="stylesheet" href="../css/base.css">
  <style>
    .setup-container {
      max-width: 500px;
      margin: 80px auto;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <div class="setup-container">
    <div class="card">
      <h2 style="color: #0056b3; margin-top: 0;">CBT First-Run Setup</h2>
      <p style="color: #666; font-size: 14px;">No administrator accounts exist. Create the primary administrator account below.</p>
      <hr>

      <div id="errorBox" class="badge badge-danger" style="display: none; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 15px; border-radius: 4px;"></div>
      <div id="successBox" class="badge badge-success" style="display: none; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 15px; border-radius: 4px;"></div>

      <form id="setupForm">
        <div class="form-group">
          <label for="username">Admin Username</label>
          <input type="text" id="username" class="form-control" placeholder="e.g. admin" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">Password (min 6 characters)</label>
          <input type="password" id="password" class="form-control" placeholder="Choose a secure password" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Retype password" required minlength="6">
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px; padding: 10px;">Register Administrator</button>
      </form>
    </div>
  </div>

  <script>
    // Check if setup already complete
    fetch('/api/auth/setup-check')
      .then(res => res.json())
      .then(data => {
        if (!data.setupRequired) {
          window.location.href = 'login.html';
        }
      });

    document.getElementById('setupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');

      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      if (password !== confirmPassword) {
        errorBox.innerText = 'Passwords do not match.';
        errorBox.style.display = 'block';
        return;
      }

      fetch('/api/auth/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          successBox.innerText = data.message + ' Redirecting to login...';
          successBox.style.display = 'block';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          errorBox.innerText = data.error || 'Setup failed.';
          errorBox.style.display = 'block';
        }
      })
      .catch(() => {
        errorBox.innerText = 'Connection error.';
        errorBox.style.display = 'block';
      });
    });
  </script>
</body>
</html>
