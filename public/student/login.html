<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Student Login - CBT System</title>
  <link rel="stylesheet" href="../css/base.css">
  <style>
    .login-container {
      max-width: 450px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .login-header h2 {
      margin: 0;
      color: #0056b3;
    }
    .login-header p {
      color: #666;
      margin-top: 5px;
    }
    .error-msg {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      display: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="card">
      <div class="login-header">
        <h2>School CBT Login</h2>
        <p>Please enter your credentials and Exam PIN</p>
      </div>

      <div id="errorBox" class="error-msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="studentName">Full Name</label>
          <input type="text" id="studentName" class="form-control" placeholder="e.g. John Doe" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="rollNumber">Roll Number / ID</label>
          <input type="text" id="rollNumber" class="form-control" placeholder="e.g. 104" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="studentGrade">Grade / Class</label>
          <select id="studentGrade" class="form-control" required>
            <option value="">-- Select Grade --</option>
            <option value="Grade 1">Grade 1</option>
            <option value="Grade 2">Grade 2</option>
            <option value="Grade 3">Grade 3</option>
            <option value="Grade 4">Grade 4</option>
            <option value="Grade 5">Grade 5</option>
            <option value="Grade 6">Grade 6</option>
            <option value="Grade 7">Grade 7</option>
            <option value="Grade 8">Grade 8</option>
            <option value="Grade 9">Grade 9</option>
            <option value="Grade 10">Grade 10</option>
          </select>
        </div>

        <div class="form-group">
          <label for="studentDivision">Division / Section</label>
          <input type="text" id="studentDivision" class="form-control" placeholder="e.g. A" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="examPin">Exam PIN</label>
          <input type="password" id="examPin" class="form-control" placeholder="6-digit PIN" required autocomplete="off">
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Verify & Start Exam</button>
      </form>
    </div>
  </div>

  <script src="js/student-login.js"></script>
</body>
</html>
